[package]
name = "opencc-fmmseg-gui"
version = "0.9.1"
description = "Open Simplified/Traditional Chinese Converter"
authors = ["laisuk"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "opencc_fmmseg_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.10", features = [] }
#serde = { version = "1", features = ["derive"] }
#serde_json = "1"
#tauri-plugin-dialog = "2.6"
tauri-plugin-opener = "2.5"
#tauri-plugin-shell = "2.3.5"
#opencc-fmmseg = {path = "../../opencc-fmmseg"}
opencc-fmmseg = "0.9"
rfd = "0.17"
tauri-plugin-clipboard-manager = "2.3"
opener = "0.8"
serde = { version = "1.0", features = ["derive"] }
regex = "1.12"
zip = "8.5"
#pdfium-helper = {path="../../pdfium-helper", features = ["pdfium-embed"] }
pdfium-helper = { git = "https://github.com/laisuk/pdfium-helper", features = ["pdfium-embed"] }
kuchiki = "0.8"
thiserror = "2.0"
quick-xml = "0.39"

