name: build-artifacts

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Tauri app
        run: npx tauri build

      # Linux
      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-linux-x64-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Linux DEB
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-linux-x64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux RPM
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-linux-x64-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

      # Windows
      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-windows-x64-msi
          path: src-tauri/target/release/bundle/msi/*
          if-no-files-found: error

      - name: Upload Windows NSIS
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-windows-x64-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

      # macOS
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*
          if-no-files-found: error

      - name: Upload macOS App Bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-macos-app
          path: src-tauri/target/release/bundle/macos/*
          if-no-files-found: error