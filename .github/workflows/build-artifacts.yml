name: build-artifacts

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------
          # Windows (x64)
          # -------------------------
          - name: windows-x64
            os: windows-latest
            platform: windows
            arch: x64
            rust_toolchain: stable

          # -------------------------
          # Linux (x64)
          # -------------------------
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
            rust_toolchain: stable

          # -------------------------
          # Linux (ARM64)
          # -------------------------
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            rust_toolchain: stable

          # -------------------------
          # macOS (ARM64)
          # -------------------------
          - name: macos-arm64
            os: macos-latest
            platform: macos
            arch: arm64
            rust_toolchain: stable

          # -------------------------
          # macOS (x64 / Intel)
          # -------------------------
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            arch: x64
            rust_toolchain: stable

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust_toolchain }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils

      - name: Build Tauri app
        run: npx tauri build

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release

          # -------------------------
          # Linux
          # -------------------------
          if [[ "${{ matrix.platform }}" == "linux" ]]; then
            cp src-tauri/target/release/bundle/deb/*.deb release/ || true
            cp src-tauri/target/release/bundle/rpm/*.rpm release/ || true
            # AppImage intentionally not collected for now
            # cp src-tauri/target/release/bundle/appimage/*.AppImage release/ || true
          fi

          # -------------------------
          # Windows
          # -------------------------
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp src-tauri/target/release/bundle/msi/* release/ || true
            cp src-tauri/target/release/bundle/nsis/* release/ || true
          fi

          # -------------------------
          # macOS
          # -------------------------
          if [[ "${{ matrix.platform }}" == "macos" ]]; then
            cp src-tauri/target/release/bundle/dmg/* release/ || true

            ZIP_PATH="$GITHUB_WORKSPACE/release/opencc-fmmseg-gui-macos-${{ matrix.arch }}-app.zip"
            cd src-tauri/target/release/bundle/macos
            zip -r "$ZIP_PATH" opencc-fmmseg-gui.app
            cd "$GITHUB_WORKSPACE"
          fi

      - name: Upload collected artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencc-fmmseg-gui-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error